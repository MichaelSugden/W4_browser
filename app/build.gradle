plugins {
    id 'com.android.application'
}

android {
    namespace 'com.digitlsky.watchbrowser'
    compileSdk 37

    defaultConfig {
        applicationId 'com.digitlsky.watchbrowser'
        minSdk 30          // Wear OS 3 (Galaxy Watch 4)
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // One APK per CPU type: GeckoView's native engine is large, so don't ship both.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug   // installs straight away via adb
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = true }   // compress the engine's native code
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Full-mode engine (Mozilla GeckoView, release channel). Only loaded when "Full" is used.
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261102144711'
}
