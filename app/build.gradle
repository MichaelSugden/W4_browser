plugins {
    id 'com.android.application'
}

android {
    namespace 'com.digitlsky.watchbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.digitlsky.watchbrowser'
        minSdk 30          // Wear OS 3 (Galaxy Watch 4)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so it installs straight away via adb.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies on purpose: no AndroidX, no Kotlin -> tiny APK, low RAM.
